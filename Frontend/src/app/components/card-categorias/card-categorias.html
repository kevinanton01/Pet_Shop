<a class="category-card" [routerLink]="ruta()">
  <span class="category-icon">
    @switch (tipo()) {
      @case ('perros') {
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <ellipse cx="5.5" cy="11" rx="2" ry="2.4" />
          <ellipse cx="9.5" cy="7" rx="2" ry="2.4" />
          <ellipse cx="14.5" cy="7" rx="2" ry="2.4" />
          <ellipse cx="18.5" cy="11" rx="2" ry="2.4" />
          <path d="M12 11.5c-2.6 0-4.8 2.3-4.8 4.8 0 1.9 1.6 3.2 3.5 3.2.7 0 1.2-.3 1.3-.3s.6.3 1.3.3c1.9 0 3.5-1.3 3.5-3.2 0-2.5-2.2-4.8-4.8-4.8z" />
        </svg>
      }
      @case ('gatos') {
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9V4l4 2h8l4-2v5a8 8 0 0 1-16 0z" />
          <circle cx="9" cy="11" r="1" fill="currentColor" />
          <circle cx="15" cy="11" r="1" fill="currentColor" />
          <path d="M2 12h3M19 12h3" />
        </svg>
      }
      @case ('aves') {
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 8c0 5-4 9-9 9H5l3-3c-2-1-3-3-3-5 0-4 3-7 7-7 4 0 8 3 8 6z" />
          <circle cx="16" cy="8" r="1" fill="currentColor" />
          <path d="M2 7l4 2" />
        </svg>
      }
      @default {
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="5" cy="12" r="1.8" />
          <circle cx="12" cy="12" r="1.8" />
          <circle cx="19" cy="12" r="1.8" />
        </svg>
      }
    }
  </span>
  <span class="category-name">{{ nombre() }}</span>
</a>
