<article class="card" role="link" tabindex="0" (click)="verDetalle.emit()" (keydown.enter)="verDetalle.emit()">
  <div class="card-media">
    <img [src]="imagen()" [alt]="nombre()" loading="lazy" />
    <span class="card-badge">{{ categoria() }}</span>
  </div>

  <div class="card-body">
    <h3 class="card-title">{{ nombre() }}</h3>

    @if (descripcion()) {
    <p class="card-desc">{{ descripcion() }}</p>
    }

    <div class="card-footer">
      <span class="card-price">${{ precio() }}</span>
      <button type="button" class="card-btn" (click)="$event.stopPropagation(); agregar.emit()">Agregar</button>
    </div>
  </div>
</article>
